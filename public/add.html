<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add a Book | BookMatch</title>
    <link rel="stylesheet" href="css/book.css" />
    <script type="module" src="js/add.js"></script>
  </head>
  <body>
    <nav>
      <a href="index.html">Books</a>
      <a href="add.html">Add a Book</a>
      <a href="lists.html">My Lists</a>
    </nav>

    <main>
      <form id="add-form">
        <h1>Add a book</h1>
        <p>
          Fill in the details and press Add book. Title and author are required.
        </p>
        <label>Title <input type="text" name="title" required /></label>
        <label>Author <input type="text" name="author" required /></label>
        <label>
          Genre
          <select name="genre">
            <option>Fantasy</option>
            <option>Science Fiction</option>
            <option>Mystery</option>
            <option>Romance</option>
            <option>Historical Fiction</option>
            <option>Horror</option>
            <option>Thriller</option>
            <option>Biography</option>
            <option>Humor</option>
            <option>Adventure</option>
          </select>
        </label>
        <label>
          Page count
          <input type="number" name="pageCount" min="1" required />
        </label>
        <label>
          Difficulty
          <select name="difficulty">
            <option>Easy</option>
            <option>Medium</option>
            <option>Hard</option>
          </select>
        </label>
        <label>
          Season
          <select name="season">
            <option>Spring</option>
            <option>Summer</option>
            <option>Fall</option>
            <option>Winter</option>
          </select>
        </label>
        <label>
          Point of view
          <select name="pov">
            <option>First person</option>
            <option>Third person</option>
            <option>Multiple perspectives</option>
          </select>
        </label>
        <label>Setting <input type="text" name="setting" /></label>
        <label>
          Themes (comma separated)
          <input type="text" name="themes" />
        </label>
        <label>
          Description
          <textarea name="description" rows="4"></textarea>
        </label>
        <button type="submit">Add book</button>
      </form>
      <p id="status" aria-live="polite"></p>
    </main>
  </body>
</html>
