<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Reading Lists | BookMatch</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/lists.css" />
    <script type="module" src="js/lists.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="index.html">BookMatch</a>
      <nav>
        <a href="index.html">Books</a>
        <a href="add.html">Add a Book</a>
        <a href="lists.html">My Lists</a>
      </nav>
    </header>

    <div class="layout">
      <aside class="create-panel">
        <h1>My reading lists</h1>
        <p class="intro">
          Type a name and description, then press Create list. Select a list's
          name to add books and track your reading.
        </p>

        <form id="create-form">
          <label>
            List name
            <input
              type="text"
              name="name"
              placeholder="e.g. Enemies to Lovers"
              maxlength="60"
            />
          </label>
          <label>
            Description
            <input
              type="text"
              name="description"
              placeholder="e.g. Favorite enemies to lovers novels"
              maxlength="200"
            />
          </label>
          <button type="submit">Create list</button>
        </form>
        <p id="status" aria-live="polite"></p>
      </aside>

      <main class="lists-area">
        <p id="list-status" aria-live="polite"></p>
        <section id="lists"></section>
      </main>
    </div>
  </body>
</html>
